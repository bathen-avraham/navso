server {
  listen 80;
  listen [::]:80;
  server_name navso.tech www.navso.tech;
  root /home/ec2-user/navso/current;
  index index.html;

  client_max_body_size 1m;

  # Hashed asset bundles — long-cache, hard 404 if missing (no SPA fallback).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: serve static, otherwise fall back to index.html for client routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
