<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2747cc"/>
      <stop offset="0.55" stop-color="#3a5fe6"/>
      <stop offset="1" stop-color="#179a89"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf0ff"/>
    </linearGradient>
  </defs>

  <!-- Brand-gradient rounded tile -->
  <rect width="64" height="64" rx="14" fill="url(#g)"/>

  <!-- Open book: two trapezoidal pages curving up to a center spine peak -->
  <g>
    <!-- Left page -->
    <path d="M14 22 Q14 20 16 20 L30 22 L30 46 L16 44 Q14 44 14 42 Z" fill="url(#page)"/>
    <!-- Right page -->
    <path d="M50 22 Q50 20 48 20 L34 22 L34 46 L48 44 Q50 44 50 42 Z" fill="url(#page)"/>
    <!-- Center spine peak that ties the two pages -->
    <path d="M30 22 L32 16 L34 22 L34 46 L32 48 L30 46 Z" fill="#ffffff"/>
  </g>

  <!-- Subtle text lines (visible only at larger sizes; degrade gracefully at favicon scale) -->
  <g stroke="#3a5fe6" stroke-opacity="0.35" stroke-width="1.4" stroke-linecap="round">
    <line x1="18" y1="28" x2="28" y2="28"/>
    <line x1="18" y1="32" x2="28" y2="32"/>
    <line x1="36" y1="28" x2="46" y2="28"/>
    <line x1="36" y1="32" x2="46" y2="32"/>
  </g>
</svg>
